<style>
:root{
  --ground:#EDF1EE;
  --surface:#FFFFFF;
  --surface-2:#F4F7F4;
  --inset:#EEF3F0;
  --ink:#15211D;
  --ink-2:#33443E;
  --muted:#61736B;
  --hair:#D6DFD9;
  --hair-2:#C2CFC8;
  --accent:#17564A;
  --accent-soft:#E2EFEA;
  --warn:#8C2F2A;
  --gold:#A5822F;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -14px rgba(0,0,0,.28);
  --display:"Noto Kufi Arabic", sans-serif;
  --body:"Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --ui:"IBM Plex Sans Arabic", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:19px; line-height:2.0;
  -webkit-text-size-adjust:100%;
}
@media (min-width:640px){ body{font-size:20px} }

/* progress bar */
.bar{position:sticky; top:0; z-index:20; background:var(--ground); border-bottom:1px solid var(--hair)}
.bar-in{max-width:46rem; margin:0 auto; padding:.55rem 1.1rem .5rem; display:flex; align-items:center; gap:.9rem; flex-wrap:wrap}
.bar-label{font-family:var(--ui); font-size:.88rem; font-weight:600; color:var(--muted); white-space:nowrap}
.track{flex:1; min-width:110px; height:6px; border-radius:99px; background:var(--hair); overflow:hidden}
.fill{height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .35s cubic-bezier(.4,0,.2,1)}
.saved{font-family:var(--ui); font-size:.8rem; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border-radius:99px; padding:.15rem .6rem; opacity:0; transition:opacity .3s}
.saved.on{opacity:1}

.wrap{max-width:46rem; margin:0 auto; padding:1.6rem 1.1rem 4rem}
.stack{display:flex; flex-direction:column; gap:1.15rem}

/* masthead */
.mast{text-align:center; padding:1.2rem 0 1.9rem}
.eyebrow{font-family:var(--ui); font-size:.86rem; font-weight:600; letter-spacing:.14em; color:var(--gold); margin:0 0 .7rem}
.mast h1{font-family:var(--display); font-weight:700; font-size:clamp(1.55rem,6vw,2.25rem);
  line-height:1.55; color:var(--accent); margin:0 0 .85rem; text-wrap:balance}
.rule{width:52px; height:2px; background:var(--gold); margin:0 auto 1rem; border-radius:2px}
.mast .subject{font-size:1.16rem; font-weight:700; color:var(--ink); margin:0 0 .4rem; text-wrap:balance}
.mast .byline{font-family:var(--ui); font-size:.95rem; color:var(--muted); margin:0; line-height:1.85}

/* cards */
.card{background:var(--surface); border:1px solid var(--hair); border-radius:14px;
  padding:1.25rem 1.15rem; box-shadow:var(--shadow)}
@media (min-width:640px){ .card{padding:1.5rem 1.4rem} }
.card.rail{border-inline-start:3px solid var(--gold)}
.card.rail-accent{border-inline-start:3px solid var(--accent)}
.card p{margin:0 0 .7rem}
.card p:last-child{margin-bottom:0}

.head{display:flex; align-items:baseline; gap:.65rem; margin-bottom:.7rem}
.badge{font-family:var(--ui); font-size:.84rem; font-weight:700; color:var(--accent);
  background:var(--accent-soft); border-radius:7px; padding:.18rem .5rem; white-space:nowrap; flex:none}
.head h2{font-family:var(--display); font-weight:600; font-size:1.22rem; line-height:1.65;
  color:var(--ink); margin:0; text-wrap:balance}

.tag{font-family:var(--ui); font-size:.85rem; font-weight:700}
.tag-gold{color:var(--gold)}
.tag-warn{color:var(--warn)}
.example{background:var(--inset); border-inline-start:2px solid var(--hair-2);
  border-radius:8px; padding:.7rem .85rem; margin:0 0 .95rem;
  font-size:1.02rem; line-height:1.9; color:var(--muted)}
.example b{color:var(--ink-2); font-weight:600}

/* comparison */
.cmp{display:grid; grid-template-columns:1fr; gap:.8rem; margin:.9rem 0 0}
@media (min-width:640px){ .cmp{grid-template-columns:1fr 1fr} }
.cmp-col{border:1.5px solid var(--hair); border-radius:12px; padding:.9rem 1rem; background:var(--surface-2)}
.cmp-col h3{font-family:var(--display); font-weight:700; font-size:1.06rem; margin:0 0 .1rem; color:var(--accent)}
.cmp-col .kind{font-family:var(--ui); font-size:.82rem; font-weight:600; color:var(--muted); display:block; margin-bottom:.6rem}
.cmp-col ul{margin:0; padding-inline-start:1.15rem}
.cmp-col li{margin-bottom:.35rem; line-height:1.8}
.yes{color:var(--accent); font-weight:700}
.no{color:var(--warn); font-weight:700}
.verdict{margin:.95rem 0 0; padding:.75rem .9rem; border-radius:10px;
  background:var(--accent-soft); color:var(--accent); font-weight:700; line-height:1.85}

/* options */
.opts{display:flex; flex-direction:column; gap:.55rem}
.opt{display:flex; align-items:flex-start; gap:.7rem; border:1.5px solid var(--hair);
  border-radius:11px; padding:.95rem 1rem; cursor:pointer; background:var(--surface-2);
  transition:border-color .16s, background .16s}
.opt:hover{border-color:var(--hair-2)}
.opt input{appearance:none; -webkit-appearance:none; width:23px; height:23px; margin:.34rem 0 0;
  flex:none; border:2px solid var(--hair-2); border-radius:50%; background:var(--surface); cursor:pointer;
  transition:border-color .16s, box-shadow .16s}
.opt input:checked{border-color:var(--accent); box-shadow:inset 0 0 0 5px var(--surface), inset 0 0 0 23px var(--accent)}
.opt input[type=checkbox]{border-radius:6px}
.opt input:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.opt:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.opt-text{flex:1; line-height:1.8; font-size:1.06rem}
.rec{display:inline-block; font-family:var(--ui); font-size:.78rem; font-weight:700;
  color:var(--accent); border:1px solid var(--accent); border-radius:99px;
  padding:.02rem .48rem; margin-inline-start:.45rem; white-space:nowrap; vertical-align:.09em}
.other{margin-top:.6rem; display:none}
.other.on{display:block}

textarea{width:100%; font-family:inherit; font-size:1.06rem; line-height:1.9; color:var(--ink);
  background:var(--surface-2); border:1.5px solid var(--hair); border-radius:10px;
  padding:.65rem .8rem; resize:vertical}
textarea:focus{outline:none; border-color:var(--accent)}
textarea::placeholder{color:var(--muted); opacity:.75}

details.info{background:var(--surface); border:1px solid var(--hair); border-radius:14px; padding:.35rem .3rem}
details.info summary{font-family:var(--display); font-weight:600; font-size:1.1rem; color:var(--accent);
  cursor:pointer; padding:.75rem .85rem; list-style:none; display:flex; align-items:center; gap:.5rem}
details.info summary::-webkit-details-marker{display:none}
details.info summary::after{content:"+"; margin-inline-start:auto; color:var(--muted); font-weight:400}
details.info[open] summary::after{content:"\2212"}
details.info .inner{padding:0 .85rem .9rem; color:var(--ink-2); font-size:1.02rem}
details.info ul{margin:.3rem 0 0; padding-inline-start:1.1rem}
details.info li{margin-bottom:.45rem}

/* send */
.finish{border-top:3px solid var(--accent)}
.finish h2{font-family:var(--display); font-weight:700; font-size:1.26rem; color:var(--accent); margin:0 0 .55rem}
.status{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin:0 0 1rem;
  padding:.7rem .9rem; border-radius:10px; background:var(--surface-2);
  border:1.5px solid var(--hair); font-family:var(--ui); font-size:.95rem}
.status .dot{width:11px; height:11px; border-radius:50%; background:var(--hair-2); flex:none}
.status.ok{background:var(--accent-soft); border-color:var(--accent)}
.status.ok .dot{background:var(--accent)}
.status.bad{border-color:var(--warn)}
.status.bad .dot{background:var(--warn)}
.status.busy .dot{background:var(--gold)}
.sent-count{color:var(--muted); font-size:.88rem}
.btns{display:flex; flex-direction:column; gap:.6rem}
@media (min-width:640px){ .btns{flex-direction:row} .btns>*{flex:1} }
.btn{font-family:var(--ui); font-size:1.12rem; font-weight:600; text-align:center;
  padding:1rem; border-radius:11px; border:1.5px solid transparent; cursor:pointer;
  text-decoration:none; display:block; transition:filter .16s, background .16s}
.btn-primary{background:var(--accent); color:var(--ground); border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent; color:var(--accent); border-color:var(--hair-2)}
.btn-ghost:hover{background:var(--accent-soft); border-color:var(--accent)}
.btn[disabled]{opacity:.6; cursor:default}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.hint{font-family:var(--ui); font-size:.92rem; color:var(--muted); margin:.9rem 0 0; text-align:center; line-height:1.85}
.hint a{color:var(--accent)}
.fallback{display:none; margin-top:1.1rem; padding-top:1rem; border-top:1px solid var(--hair)}
.fallback.on{display:block}
.preview{margin-top:1rem; background:var(--inset); border:1px solid var(--hair); border-radius:10px;
  padding:.9rem; font-size:.98rem; line-height:1.9; color:var(--ink-2); white-space:pre-wrap;
  max-height:18rem; overflow:auto; display:none}
.preview.on{display:block}
.foot{text-align:center; margin-top:2rem; font-family:var(--ui); font-size:.95rem; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>

  var T = CFG.strings;
  var RTL = CFG.dir === "rtl";

  var AR = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  function num(n) {
    n = String(n);
    return CFG.arabicNumerals ? n.replace(/\d/g, function (d) { return AR[+d]; }) : n;
  }

  var KEY = "survey:" + CFG.id;
  var state = { answers: {}, other: {}, notes: "", sentAt: 0, sentTimes: 0, lastError: false };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); if (p && typeof p === "object") {
      state.answers = p.answers || {}; state.other = p.other || {}; state.notes = p.notes || "";
      state.sentAt = p.sentAt || 0; state.sentTimes = p.sentTimes || 0; state.lastError = !!p.lastError;
    } }
  } catch (e) {}

  var savedChip = document.getElementById("saved"), savedTimer = null;
  savedChip.textContent = T.saved;
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { return; }
    savedChip.classList.add("on");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () { savedChip.classList.remove("on"); }, 1600);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function rich(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;   // authored content only, never respondent input
    return n;
  }

  // ---------- masthead ----------
  var mast = document.getElementById("mast");
  if (CFG.eyebrow) mast.appendChild(el("p", "eyebrow", CFG.eyebrow));
  if (CFG.headline) mast.appendChild(rich("h1", null, CFG.headline));
  mast.appendChild(el("div", "rule"));
  if (CFG.subject) mast.appendChild(el("p", "subject", CFG.subject));
  if (CFG.byline) mast.appendChild(rich("p", "byline", CFG.byline));

  // ---------- body ----------
  var stack = document.getElementById("stack");

  function addCard(block) {
    var c = el("div", "card" + (block.rail ? " rail" : "") + (block.railAccent ? " rail-accent" : ""));
    if (block.badge || block.heading) {
      var h = el("div", "head");
      if (block.badge) h.appendChild(el("span", "badge", block.badge));
      if (block.heading) h.appendChild(rich("h2", null, block.heading));
      c.appendChild(h);
    }
    (block.paragraphs || []).forEach(function (t) { c.appendChild(rich("p", null, t)); });
    if (block.compare) {
      var g = el("div", "cmp");
      block.compare.forEach(function (col) {
        var d = el("div", "cmp-col");
        d.appendChild(el("h3", null, col.name));
        if (col.kind) d.appendChild(el("span", "kind", col.kind));
        var ul = el("ul");
        (col.points || []).forEach(function (pt) {
          var li = el("li");
          li.appendChild(rich("span", pt.good ? "yes" : "no", pt.good ? "✓" : "✗"));
          li.appendChild(rich("span", null, " " + pt.text));
          ul.appendChild(li);
        });
        d.appendChild(ul);
        g.appendChild(d);
      });
      c.appendChild(g);
    }
    (block.examples || []).forEach(function (t) { c.appendChild(rich("p", "example", t)); });
    if (block.verdict) c.appendChild(rich("p", "verdict", block.verdict));
    stack.appendChild(c);
    return c;
  }

  (CFG.before || []).forEach(addCard);

  // ---------- questions ----------
  var QS = CFG.questions || [];
  QS.forEach(function (q, qi) {
    var id = String(qi);
    var c = el("div", "card");
    var h = el("div", "head");
    h.appendChild(el("span", "badge", (T.questionWord || "") + " " + num(qi + 1)));
    h.appendChild(rich("h2", null, q.title));
    c.appendChild(h);
    if (q.body) c.appendChild(rich("p", null, q.body));
    (q.examples || []).forEach(function (t) { c.appendChild(rich("p", "example", t)); });
    if (q.view) c.appendChild(rich("p", null, '<span class="tag tag-gold">' + T.ourView + '</span> ' + q.view));
    if (q.ask)  c.appendChild(rich("p", null, '<span class="tag tag-warn">' + T.weAsk + '</span> ' + q.ask));

    var box = el("div", "opts");
    var multi = q.type === "multi";
    var opts = (q.options || []).concat(q.allowOther === false ? [] : [{ t: T.otherOption, other: true }]);
    var otherIndex = opts.length - 1;

    opts.forEach(function (o, i) {
      var lab = el("label", "opt");
      var input = document.createElement("input");
      input.type = multi ? "checkbox" : "radio";
      input.name = "q" + id;
      input.value = String(i);
      if (multi) { if ((state.answers[id] || []).indexOf(i) !== -1) input.checked = true; }
      else if (state.answers[id] === i) input.checked = true;
      var span = el("span", "opt-text", o.t);
      if (o.rec) span.appendChild(el("span", "rec", T.recommended));
      lab.appendChild(input); lab.appendChild(span);
      box.appendChild(lab);
    });

    var wrap = el("div", "other");
    var ta = document.createElement("textarea");
    ta.rows = 2; ta.placeholder = T.otherPlaceholder; ta.value = state.other[id] || "";
    wrap.appendChild(ta); box.appendChild(wrap);

    function syncOther() {
      var on = multi ? (state.answers[id] || []).indexOf(otherIndex) !== -1
                     : state.answers[id] === otherIndex;
      wrap.classList.toggle("on", !!(q.allowOther !== false && on));
    }
    syncOther();

    box.addEventListener("change", function (ev) {
      if (ev.target.tagName !== "INPUT") return;
      var v = parseInt(ev.target.value, 10);
      if (multi) {
        var cur = state.answers[id] || [];
        state.answers[id] = ev.target.checked
          ? cur.concat([v]) : cur.filter(function (x) { return x !== v; });
      } else {
        state.answers[id] = v;
      }
      syncOther(); persist(); refresh(); nudge();
    });
    ta.addEventListener("input", function () { state.other[id] = ta.value; persist(); nudge(); });

    c.appendChild(box);
    stack.appendChild(c);
  });

  (CFG.after || []).forEach(addCard);

  // ---------- notes ----------
  var notes = null;
  if (CFG.notes) {
    var nc = el("div", "card");
    var nh = el("div", "head");
    nh.appendChild(el("span", "badge", CFG.notes.badge || ""));
    nh.appendChild(rich("h2", null, CFG.notes.heading || ""));
    nc.appendChild(nh);
    notes = document.createElement("textarea");
    notes.rows = 5; notes.placeholder = CFG.notes.placeholder || ""; notes.value = state.notes;
    notes.addEventListener("input", function () { state.notes = notes.value; persist(); nudge(); });
    nc.appendChild(notes);
    stack.appendChild(nc);
  }

  // ---------- collapsible info ----------
  (CFG.details || []).forEach(function (d) {
    var det = el("details", "info");
    det.appendChild(el("summary", null, d.summary));
    var inner = el("div", "inner");
    (d.paragraphs || []).forEach(function (t) { inner.appendChild(rich("p", null, t)); });
    if (d.bullets) {
      var ul = el("ul");
      d.bullets.forEach(function (b) { ul.appendChild(rich("li", null, b)); });
      inner.appendChild(ul);
    }
    if (d.closing) inner.appendChild(rich("p", null, '<b style="color:var(--accent)">' + d.closing + '</b>'));
    det.appendChild(inner);
    stack.appendChild(det);
  });

  // ---------- send card ----------
  var fc = el("div", "card finish");
  fc.appendChild(el("h2", null, T.sendHeading));
  var status = el("div", "status");
  status.appendChild(el("span", "dot"));
  var statusTxt = el("span"); status.appendChild(statusTxt);
  var sentCount = el("span", "sent-count"); status.appendChild(sentCount);
  fc.appendChild(status);
  var note = el("p", null, T.sendNote); fc.appendChild(note);
  var btns = el("div", "btns");
  var sendBtn = el("button", "btn btn-primary"); sendBtn.type = "button";
  var previewBtn = el("button", "btn btn-ghost", T.previewShow); previewBtn.type = "button";
  btns.appendChild(sendBtn); btns.appendChild(previewBtn); fc.appendChild(btns);
  fc.appendChild(el("p", "hint", T.sendHint));

  var fallback = el("div", "fallback");
  fallback.appendChild(rich("p", null, T.fallbackLead));
  var fb = el("div", "btns");
  var sendBtn2 = document.createElement("a");
  sendBtn2.className = "btn btn-ghost"; sendBtn2.target = "_blank"; sendBtn2.rel = "noopener";
  sendBtn2.href = "#"; sendBtn2.textContent = T.fallbackButton;
  fb.appendChild(sendBtn2); fallback.appendChild(fb);
  var alt = el("p", "hint");
  var waBtn = document.createElement("a"); waBtn.href = "#"; waBtn.target = "_blank";
  waBtn.rel = "noopener"; waBtn.textContent = T.fallbackWhatsApp;
  var copyBtn = document.createElement("a"); copyBtn.href = "#"; copyBtn.textContent = T.fallbackCopy;
  alt.appendChild(waBtn); alt.appendChild(document.createTextNode("  ·  ")); alt.appendChild(copyBtn);
  fallback.appendChild(alt); fc.appendChild(fallback);
  var preview = el("div", "preview"); preview.tabIndex = 0; fc.appendChild(preview);
  stack.appendChild(fc);
  document.getElementById("foot").textContent = CFG.footer || "";

  // ---------- progress ----------
  var counter = document.getElementById("counter"), fill = document.getElementById("fill");
  function answered() {
    var n = 0;
    QS.forEach(function (q, i) {
      var a = state.answers[String(i)];
      if (q.type === "multi" ? (a && a.length) : typeof a === "number") n++;
    });
    return n;
  }
  function refresh() {
    var n = answered(), total = QS.length;
    counter.textContent = T.progress.replace("{n}", num(n)).replace("{total}", num(total));
    fill.style.width = total ? (n / total * 100) + "%" : "0%";
    note.textContent = n === total ? T.sendNoteDone
      : (n > 0 ? T.sendNotePartial.replace("{left}", num(total - n)) : T.sendNote);
  }

  // ---------- summary ----------
  function buildSummary() {
    var L = [];
    if (CFG.summaryHeader) L.push(CFG.summaryHeader, "");
    QS.forEach(function (q, i) {
      var id = String(i), a = state.answers[id];
      L.push(num(i + 1) + ") " + (q.short || q.title));
      var opts = q.options || [];
      var otherIndex = opts.length;
      function label(v) {
        if (v === otherIndex) return T.otherLabel + " " + ((state.other[id] || "").trim() || T.blank);
        return opts[v] ? opts[v].t : "?";
      }
      if (q.type === "multi") {
        if (!a || !a.length) L.push("   ← " + T.unanswered);
        else a.slice().sort(function (x, y) { return x - y; }).forEach(function (v) { L.push("   ← " + label(v)); });
      } else {
        L.push("   ← " + (typeof a === "number" ? label(a) : T.unanswered));
      }
      L.push("");
    });
    if (CFG.notes) {
      L.push((CFG.notes.summaryLabel || CFG.notes.heading || "") + ":");
      L.push((state.notes || "").trim() || T.none);
    }
    return L.join("\n");
  }

  function showPreview() { preview.textContent = buildSummary(); preview.classList.add("on"); }
  previewBtn.addEventListener("click", function () {
    if (preview.classList.contains("on")) { preview.classList.remove("on"); previewBtn.textContent = T.previewShow; }
    else { showPreview(); previewBtn.textContent = T.previewHide; }
  });

  // ---------- send ----------
  var gform = document.getElementById("gform"), gfield = document.getElementById("gfield"),
      sink = document.getElementById("gfsink");
  var pending = false, failTimer = null;

  function fmtTime(ms) {
    var d = new Date(ms), hh = d.getHours(), mm = d.getMinutes();
    var h12 = hh % 12; if (h12 === 0) h12 = 12;
    var suffix = hh < 12 ? T.am : T.pm;
    return num(d.getDate()) + "/" + num(d.getMonth() + 1) + " — " +
           num(h12) + ":" + num(mm < 10 ? "0" + mm : mm) + " " + suffix;
  }

  function renderStatus() {
    status.className = "status";
    fallback.classList.remove("on");
    if (pending) { status.classList.add("busy"); statusTxt.textContent = T.sending; sentCount.textContent = ""; return; }
    if (state.lastError) {
      status.classList.add("bad");
      statusTxt.textContent = T.failed;
      sentCount.textContent = "";
      fallback.classList.add("on");
      sendBtn.textContent = T.retry;
      return;
    }
    if (state.sentAt) {
      status.classList.add("ok");
      statusTxt.textContent = T.delivered + " — " + fmtTime(state.sentAt);
      sentCount.textContent = state.sentTimes > 1 ? T.sentTimes.replace("{n}", num(state.sentTimes)) : "";
      sendBtn.textContent = T.resend;
      return;
    }
    statusTxt.textContent = T.notSent;
    sentCount.textContent = "";
    sendBtn.textContent = T.send;
  }

  function nudge() {
    if (state.sentAt && !pending && !state.lastError) {
      statusTxt.textContent = T.changedAfterSend;
      status.className = "status busy";
    }
  }

  sink.addEventListener("load", function () {
    if (!pending) return;
    pending = false; clearTimeout(failTimer);
    state.sentAt = Date.now(); state.sentTimes = (state.sentTimes || 0) + 1; state.lastError = false;
    persist(); sendBtn.disabled = false; renderStatus();
    status.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  function fail() {
    clearTimeout(failTimer); pending = false; state.lastError = true; persist();
    sendBtn.disabled = false;
    var text = buildSummary();
    sendBtn2.href = CFG.prefillUrl + encodeURIComponent(text);
    waBtn.href = "https://wa.me/?text=" + encodeURIComponent(text);
    renderStatus();
  }

  sendBtn.addEventListener("click", function () {
    if (pending) return;
    gfield.value = buildSummary();
    pending = true; sendBtn.disabled = true; renderStatus();
    clearTimeout(failTimer);
    failTimer = setTimeout(fail, 9000);
    try { gform.submit(); } catch (e) { fail(); }
  });

  copyBtn.addEventListener("click", function (ev) {
    ev.preventDefault();
    var text = buildSummary(); showPreview();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { alt.title = T.copied; });
    }
  });

  refresh(); renderStatus();
})();
</script>
</body>
</html>
